# Personal Kitty overrides
# This file contains jimmitjoo's custom Kitty settings

# Font customization
font_family FiraCode Nerd Font
font_size 16.0
disable_ligatures never
adjust_line_height 150%

# Tab management - simpler keybindings
map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Unbind for Claude Code team navigation
map shift+up no_op
map shift+down no_op
